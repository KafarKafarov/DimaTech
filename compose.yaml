services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dimatech
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dimatech"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"

  app:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-DimaTech API}
      DEBUG: ${DEBUG:-false}
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/dimatech
      DATABASE_URL_SYNC: postgresql+psycopg://postgres:postgres@postgres:5432/dimatech
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-to-a-long-jwt-secret-key-1234567890}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      PAYMENT_SIGNATURE_SECRET: ${PAYMENT_SIGNATURE_SECRET:-gfdmhghif38yrf9ew0jkf32}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-60}
    ports:
      - "8000:8000"

volumes:
  postgres_data:
