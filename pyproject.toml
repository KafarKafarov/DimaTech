[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "dimatech"
version = "0.1.0"
description = "Асинхронное REST API приложение для тестового задания DimaTech."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"alembic>=1.14.1",
	"asyncpg>=0.30.0",
	"email-validator>=2.2.0",
	"fastapi>=0.116.1",
	"httpx>=0.28.1",
	"pydantic-settings>=2.7.1",
	"psycopg[binary]>=3.2.10",
	"pwdlib[argon2]>=0.2.1",
	"pyjwt>=2.10.1",
	"sqlalchemy>=2.0.36",
	"uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
	"aiosqlite>=0.20.0",
	"asgi-lifespan>=2.1.0",
	"mypy>=1.15.0",
	"pytest>=8.3.5",
	"pytest-asyncio>=0.25.3",
	"ruff>=0.11.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dimatech"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
	"E",
	"F",
	"I",
	"B",
	"UP",
	"N",
	"ASYNC",
	"RUF",
]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "single"
indent-style = "tab"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
plugins = []
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict = true
mypy_path = "src"
packages = ["dimatech"]

[[tool.mypy.overrides]]
module = ["jwt.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["asgi_lifespan.*"]
ignore_missing_imports = true
